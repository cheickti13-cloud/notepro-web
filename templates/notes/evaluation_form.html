{% extends "base.html" %}
{% block titre %}Évaluation{% endblock %}
{% block contenu %}
<div class="carte" style="max-width:560px">
  <h1>{% if evaluation %}Modifier{% else %}Nouvelle{% endif %} évaluation — {{ ens }}</h1>
  <form method="post">{% csrf_token %}{% include "_form.html" %}
    <button type="submit">Enregistrer</button>
    <a class="btn btn-secondaire" href="{% url 'notes:evaluations' ens.pk %}">Annuler</a>
  </form>
</div>
{% endblock %}
