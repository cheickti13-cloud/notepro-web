{% extends "base.html" %}
{% block titre %}Cahier de texte{% endblock %}
{% block contenu %}
<h1>Cahier de texte</h1>
<div class="grille">
  {% for e in enseignements %}
  <div class="carte"><h3>{{ e.matiere }} — {{ e.classe }}</h3>
    <a class="btn" href="{% url 'cahier:enseignement' e.pk %}">Ouvrir</a>
    <a class="btn btn-secondaire" href="{% url 'cahier:devoir_creer' e.pk %}">+ Devoir</a>
    <a class="btn btn-secondaire" href="{% url 'cahier:contenu_creer' e.pk %}">+ Séance</a>
  </div>
  {% empty %}<div class="carte">Aucun enseignement pour l'année active.</div>{% endfor %}
</div>
{% endblock %}
